<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1f3350"/>
      <stop offset="60%" stop-color="#0f1a2c"/>
      <stop offset="100%" stop-color="#070b14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="35%" stop-color="#f2c457"/>
      <stop offset="70%" stop-color="#b47a1c"/>
      <stop offset="100%" stop-color="#6e4510"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="50%" stop-color="#d9a33a"/>
      <stop offset="100%" stop-color="#7a4d12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4b22"/>
      <stop offset="100%" stop-color="#3e1d0a"/>
    </linearGradient>
    <linearGradient id="woodLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a55a2a"/>
      <stop offset="100%" stop-color="#5a2a10"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1406"/>
      <stop offset="100%" stop-color="#140902"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd76a" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#ffb43c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffb43c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coin" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="50%" stop-color="#f2c457"/>
      <stop offset="100%" stop-color="#9a6416"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background + frame (as in the BGF logo) -->
  <rect width="1024" height="1024" rx="90" fill="url(#bg)"/>
  <rect x="22" y="22" width="980" height="980" rx="72" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <rect x="44" y="44" width="936" height="936" rx="56" fill="none" stroke="#6e4510" stroke-width="3"/>

  <g transform="translate(512 520) scale(1.22) translate(-512 -500)">
  <!-- light from the open chest -->
  <ellipse cx="512" cy="470" rx="380" ry="330" fill="url(#glow)"/>
  <g stroke="#ffe08a" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round">
    <line x1="512" y1="440" x2="512" y2="170"/>
    <line x1="440" y1="450" x2="330" y2="215"/>
    <line x1="584" y1="450" x2="694" y2="215"/>
    <line x1="390" y1="470" x2="215" y2="330"/>
    <line x1="634" y1="470" x2="809" y2="330"/>
  </g>

  <g filter="url(#shadow)">
    <!-- open lid (tilted back) -->
    <path d="M262,470 L300,300 Q512,230 724,300 L762,470 Z" fill="url(#woodLid)" stroke="url(#goldH)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M300,300 Q512,230 724,300" fill="none" stroke="url(#gold)" stroke-width="26"/>
    <line x1="420" y1="268" x2="398" y2="470" stroke="url(#goldH)" stroke-width="22"/>
    <line x1="604" y1="268" x2="626" y2="470" stroke="url(#goldH)" stroke-width="22"/>

    <!-- inside and treasure -->
    <path d="M262,470 L762,470 L742,520 L282,520 Z" fill="url(#inside)"/>
    <g stroke="#7a4d12" stroke-width="4">
      <circle cx="380" cy="478" r="44" fill="url(#coin)"/>
      <circle cx="470" cy="462" r="50" fill="url(#coin)"/>
      <circle cx="566" cy="468" r="46" fill="url(#coin)"/>
      <circle cx="650" cy="482" r="40" fill="url(#coin)"/>
      <circle cx="520" cy="440" r="38" fill="url(#coin)"/>
    </g>
    <!-- a gem -->
    <path d="M512,382 L548,420 L512,470 L476,420 Z" fill="#7fd0ff" stroke="#e8f8ff" stroke-width="5"/>
    <path d="M476,420 L548,420 M512,382 L512,470" stroke="#e8f8ff" stroke-opacity="0.6" stroke-width="3"/>

    <!-- chest body -->
    <rect x="252" y="500" width="520" height="290" rx="22" fill="url(#wood)" stroke="url(#goldH)" stroke-width="16"/>
    <g stroke="#2a1406" stroke-opacity="0.45" stroke-width="5">
      <line x1="262" y1="590" x2="762" y2="590"/>
      <line x1="262" y1="690" x2="762" y2="690"/>
    </g>
    <!-- gold bands -->
    <rect x="252" y="500" width="520" height="40" fill="url(#gold)"/>
    <rect x="390" y="500" width="38" height="290" fill="url(#goldH)"/>
    <rect x="596" y="500" width="38" height="290" fill="url(#goldH)"/>
    <!-- lock plate -->
    <rect x="466" y="540" width="92" height="120" rx="14" fill="url(#gold)" stroke="#6e4510" stroke-width="5"/>
    <circle cx="512" cy="588" r="14" fill="#2a1406"/>
    <path d="M504,594 L520,594 L516,630 L508,630 Z" fill="#2a1406"/>
    <!-- corner caps -->
    <g fill="url(#goldH)" stroke="#6e4510" stroke-width="3">
      <path d="M252,740 L252,790 L302,790 Z"/>
      <path d="M772,740 L772,790 L722,790 Z"/>
    </g>
  </g>
  </g>
</svg>
